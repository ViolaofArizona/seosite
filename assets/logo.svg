<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <!-- Sun/starburst icon -->
  <g transform="translate(218, 18)">
    <circle cx="0" cy="0" r="5" fill="#2AAA6A"/>
    <g stroke="#2AAA6A" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-8" x2="0" y2="-14"/>
      <line x1="6" y1="-6" x2="10" y2="-10"/>
      <line x1="8" y1="0" x2="14" y2="0"/>
      <line x1="6" y1="6" x2="10" y2="10"/>
      <line x1="-6" y1="-6" x2="-10" y2="-10"/>
      <line x1="-8" y1="0" x2="-14" y2="0"/>
      <line x1="0" y1="8" x2="0" y2="14"/>
      <line x1="-6" y1="6" x2="-10" y2="10"/>
      <line x1="3" y1="-7" x2="5" y2="-12"/>
      <line x1="7" y1="-3" x2="12" y2="-5"/>
      <line x1="7" y1="3" x2="12" y2="5"/>
      <line x1="3" y1="7" x2="5" y2="12"/>
      <line x1="-3" y1="-7" x2="-5" y2="-12"/>
      <line x1="-7" y1="-3" x2="-12" y2="-5"/>
      <line x1="-7" y1="3" x2="-12" y2="5"/>
      <line x1="-3" y1="7" x2="-5" y2="12"/>
    </g>
  </g>
  
  <!-- "rise" in green — bold -->
  <text x="10" y="75" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" fill="#3BB54A" letter-spacing="-2">rise</text>
  
  <!-- "up" in blue — lighter weight, raised up, tight to "rise" -->
  <text x="140" y="55" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="400" fill="#2E86C1" letter-spacing="-2">up</text>
  
  <!-- "BENEFITS GROUP" in blue -->
  <text x="30" y="103" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2E86C1" letter-spacing="5">BENEFITS GROUP</text>
</svg>
