<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  
  <!-- "rise" in green — bold -->
  <text x="10" y="75" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" fill="#3BB54A" letter-spacing="-2">rise</text>
  
  <!-- "u" in blue — raised, tight against "rise" -->
  <text x="136" y="55" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="400" fill="#2E86C1" letter-spacing="-2">u</text>
  
  <!-- "p" in blue — with sun rays around it -->
  <text x="172" y="55" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="400" fill="#2E86C1" letter-spacing="-2">p</text>
  
  <!-- Sun rays radiating from the top of the "p" bowl -->
  <g transform="translate(195, 28)" stroke="#2E86C1" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-6" x2="0" y2="-14"/>
    <line x1="5" y1="-4" x2="10" y2="-10"/>
    <line x1="7" y1="0" x2="14" y2="0"/>
    <line x1="5" y1="4" x2="10" y2="10"/>
    <line x1="-5" y1="-4" x2="-10" y2="-10"/>
    <line x1="-7" y1="0" x2="-14" y2="0"/>
    <line x1="-5" y1="4" x2="-10" y2="10"/>
    <line x1="0" y1="6" x2="0" y2="14"/>
    <!-- Extra rays -->
    <line x1="3" y1="-5" x2="5" y2="-12"/>
    <line x1="6" y1="-2" x2="12" y2="-5"/>
    <line x1="6" y1="2" x2="12" y2="5"/>
    <line x1="3" y1="5" x2="5" y2="12"/>
    <line x1="-3" y1="-5" x2="-5" y2="-12"/>
    <line x1="-6" y1="-2" x2="-12" y2="-5"/>
    <line x1="-6" y1="2" x2="-12" y2="5"/>
    <line x1="-3" y1="5" x2="-5" y2="12"/>
  </g>
  
  <!-- "BENEFITS GROUP" in blue -->
  <text x="30" y="103" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2E86C1" letter-spacing="5">BENEFITS GROUP</text>
</svg>
