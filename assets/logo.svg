<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- Sun/starburst icon -->
  <g transform="translate(250, 28)">
    <circle cx="0" cy="0" r="6" fill="#2AAA6A"/>
    <g stroke="#2AAA6A" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-10" x2="0" y2="-16"/>
      <line x1="7" y1="-7" x2="11" y2="-11"/>
      <line x1="10" y1="0" x2="16" y2="0"/>
      <line x1="7" y1="7" x2="11" y2="11"/>
      <line x1="-7" y1="-7" x2="-11" y2="-11"/>
      <line x1="-10" y1="0" x2="-16" y2="0"/>
      <line x1="0" y1="10" x2="0" y2="16"/>
      <line x1="-7" y1="7" x2="-11" y2="11"/>
      <!-- Extra rays for density -->
      <line x1="4" y1="-9" x2="6" y2="-14"/>
      <line x1="9" y1="-4" x2="14" y2="-6"/>
      <line x1="9" y1="4" x2="14" y2="6"/>
      <line x1="4" y1="9" x2="6" y2="14"/>
      <line x1="-4" y1="-9" x2="-6" y2="-14"/>
      <line x1="-9" y1="-4" x2="-14" y2="-6"/>
      <line x1="-9" y1="4" x2="-14" y2="6"/>
      <line x1="-4" y1="9" x2="-6" y2="14"/>
    </g>
  </g>
  
  <!-- "rise" text in green -->
  <text x="18" y="72" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800" fill="#3BB54A" letter-spacing="-1">rise</text>
  
  <!-- "up" text in blue — raised higher and closer -->
  <text x="162" y="58" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="400" fill="#2E86C1" letter-spacing="-1">up</text>
  
  <!-- "BENEFITS GROUP" text in blue -->
  <text x="52" y="102" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#2E86C1" letter-spacing="5">BENEFITS GROUP</text>
</svg>
