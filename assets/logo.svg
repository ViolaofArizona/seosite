<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 120" width="290" height="120">
  
  <!-- "rise" in green — bold -->
  <text x="8" y="75" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" fill="#3BB54A" letter-spacing="-2">rise</text>
  
  <!-- "u" in blue — raised, right next to "rise" -->
  <text x="133" y="55" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="400" fill="#2E86C1">u</text>
  
  <!-- "p" in blue — the bowl of p IS the sun -->
  <text x="168" y="55" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="400" fill="#2E86C1">p</text>
  
  <!-- Sun rays radiating from the BOWL of the "p" (center of round part) -->
  <g transform="translate(198, 30)" stroke="#2AAA6A" stroke-width="2" stroke-linecap="round">
    <!-- Top -->
    <line x1="0" y1="-12" x2="0" y2="-22"/>
    <!-- Top-right -->
    <line x1="8" y1="-8" x2="16" y2="-16"/>
    <!-- Right -->
    <line x1="12" y1="0" x2="22" y2="0"/>
    <!-- Bottom-right -->
    <line x1="8" y1="8" x2="16" y2="16"/>
    <!-- Top-left -->
    <line x1="-8" y1="-8" x2="-16" y2="-16"/>
    <!-- In-between rays -->
    <line x1="4" y1="-11" x2="8" y2="-20"/>
    <line x1="11" y1="-4" x2="20" y2="-8"/>
    <line x1="11" y1="4" x2="20" y2="8"/>
    <line x1="4" y1="11" x2="8" y2="20"/>
    <line x1="-4" y1="-11" x2="-8" y2="-20"/>
    <line x1="-11" y1="-4" x2="-20" y2="-8"/>
  </g>
  
  <!-- "BENEFITS" in blue, "GROUP" in green -->
  <text x="28" y="103" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="5">
    <tspan fill="#2E86C1">BENEFITS </tspan><tspan fill="#3BB54A">GROUP</tspan>
  </text>
</svg>
